name: ITDR Agent CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic fastapi uvicorn pydantic python-dotenv pytest pytest-cov httpx

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t itdr-agent:latest .

      - name: Test Docker health
        run: |
          docker run -d -p 8000:8000 \
            -e ANTHROPIC_API_KEY=test-key \
            --name itdr-test itdr-agent:latest
          sleep 8
          curl -f http://localhost:8000/health || exit 1
          docker stop itdr-test
